# This is a Databricks asset bundle definition for bundle_proyecto.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bundle_proyecto
  uuid: 4d7af1c9-6bc8-477b-8c6e-fa993c8e20af

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  amb:
    description: Ambiente de despliegue (dev/prod)
  sql_warehouse_id:
    description: The SQL warehouse to use for dashboards

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-e57b1425-f9ac.cloud.databricks.com
    variables:
      catalog: fintech_finpay
      schema: default
      amb: dev
      sql_warehouse_id: 2d6b0ff07428989f
  prod:
    mode: production
    workspace:
      host: https://dbc-45d7648c-6572.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/diegobernalesvaldivia@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/diegobernalesvaldivia@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: fintech_finpay
      schema: default
      amb: prod
      sql_warehouse_id: 91e15e77c9492e6f
    permissions:
      - user_name: diegobernalesvaldivia@gmail.com
        level: CAN_MANAGE
